<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Property Form</h2>
    <div class="card p-4 shadow">
        <input type="hidden" id="propertyId">
        <div class="mb-3">
            <input type="text" class="form-control" id="address" placeholder="Address" required>
        </div>
        <div class="mb-3">
            <input type="number" class="form-control" id="price" placeholder="Price" required>
        </div>
        <div class="mb-3">
            <input type="number" class="form-control" id="size" placeholder="Size" required>
        </div>
        <div class="mb-3">
            <input type="text" class="form-control" id="description" placeholder="Description" required>
        </div>
        <button class="btn btn-primary w-100" onclick="addOrUpdateProperty()">Save Property</button>
    </div>

    <h2 class="text-center my-4">Properties List</h2>
    <table class="table table-bordered table-striped shadow">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Address</th>
            <th>Price</th>
            <th>Size</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="propertyTable"></tbody>
    </table>
</div>

<script src="script.js"></script>
</body>
</html>
